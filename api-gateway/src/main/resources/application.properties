spring.application.name=api-gateway
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:apigateway;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=3000
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.structured.format.console=logstash
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eurekalogin:eurekapassword@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

spring.main.web-application-type=reactive
app.security.public-key=${JWT_PUBLIC_KEY:classpath:keys/public.pem}
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=1000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=25s
server.max-http-request-header-size=16KB

springdoc.swagger-ui.urls[0].name=Booking Service
springdoc.swagger-ui.urls[0].url=/docs/booking
springdoc.swagger-ui.urls[1].name=Hotel Service
springdoc.swagger-ui.urls[1].url=/docs/hotel
management.endpoint.health.group.readiness.include=readinessState,backendDiscovery
