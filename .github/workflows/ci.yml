name: Проверка и сборка проекта перед push или pull request в main-ветку
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [discovery-server, hotel-service, booking-service, api-gateway]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh ./mvnw -B -ntp clean verify
        working-directory: ${{ matrix.service }}
  compose:
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up --build --wait --wait-timeout 300
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
