spring.application.name=discovery-server
server.port=${PORT:8761}
spring.datasource.url=jdbc:h2:mem:discoveryserver;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=3000
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.structured.format.console=logstash
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eurekalogin:eurekapassword@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=${EUREKA_HOST:localhost}
eureka.instance.prefer-ip-address=false
app.registry.username=${REGISTRY_USERNAME:eurekalogin}
app.registry.password=${REGISTRY_PASSWORD:eurekapassword}
