spring.application.name=hotel-service
server.port=${PORT:8081}
spring.datasource.url=jdbc:h2:mem:hotelservice;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=3000
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.structured.format.console=logstash
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eurekalogin:eurekapassword@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.swagger-ui.path=/swagger-ui.html
spring.flyway.locations=classpath:db/migration,classpath:db/demo
app.security.public-key=${JWT_PUBLIC_KEY:classpath:keys/public.pem}
app.security.issuer=hotels-booking
app.security.audience=hotels-api
